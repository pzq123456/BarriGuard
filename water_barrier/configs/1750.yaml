# water_gap 标定: 1750 机位(初值直接 copy 1749, 待实测重标)。
# 本目录 (water_barrier/configs/) 归算法包所有: ROI + 算法参数都在这里调，
# server/config.yaml 只引用路径。调完重启 server 生效。
# poly 来自 data/1750/clean_01.json 4 个 barrier(归一化, 文件顺序)。
# U 按角色映射 1749 冻结值(左近 28.5 / 远 3.0 / 右近 6.0); track 全 copy 1749。
# road_rois 取自 clean_01.jpg 中央沥青路面 (避开阴影/水印/草地)。


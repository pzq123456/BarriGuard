# road_rois 只取晴天沥青: 阴影水马与路面同为中性灰, 宽 profile 会把影子判成路。
# 注意(2026-09-10 实测): 晴天沥青本身读白(white 0.6~0.86), 真缺口(露路)在
# 日光下形不成 dip —— 本机位日光时段真缺口灵敏度接近零, 不是阈值问题。
# 当前目标仅为已知无缺口画面零误报; 阴雨/夜间行为另行验证。
road_rois: [[750, 450, 1000, 600]]

track:
  decay_rate: 0.5
  alarm_hold_s: 10.0
  reconfirm_s: 5.0
  # 0.50: 九图阴影 FP 的 rer 全 ≤0.40，留 0.10 裕量压住。代价见 road_rois 注释。
  rer_threshold: 0.5
  track_stale_s: 8.0
  match_iou: 0.25
  match_center_ratio: 0.5
  median_window: 5
  intact_reset_s: 5.0
  rer_purity: 0.70
  patch_size: 8
  sunglare_road_white: 0.65

# water_gap 标定: 1749 机位(已冻结, 与旧 server/config.yaml + water_barrier 常量一致)。
# 本目录 (water_barrier/configs/) 归算法包所有: ROI + 算法参数都在这里调，
# server/config.yaml 只引用路径。调完重启 server 生效。
# rows.poly 为归一化多边形 (与 data/test/night_12000.json 一致，已内联，无 null)。
# 未列出的检测阈值 (REF/FLOOR/MIN_WIDTH/BASE_WIN 等) 仍用模块默认值。
rows:

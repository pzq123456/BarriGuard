    U: 6.0
    report: false

road_rois: [[700, 700, 1000, 860], [1040, 560, 1240, 660], [600, 850, 900, 900]]

track:
  decay_rate: 0.5
  alarm_hold_s: 10.0
  reconfirm_s: 5.0
  rer_threshold: 0.25
  track_stale_s: 8.0
  match_iou: 0.25
  match_center_ratio: 0.5
  median_window: 5
  intact_reset_s: 5.0
  rer_purity: 0.70
  patch_size: 8
  # 日光门控：路面 white 占比中位数超此值则整帧 SUNGLARE（冻结、不累计）。

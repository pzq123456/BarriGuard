    poly: [[0.0, 0.516938], [0.689914, 0.365628], [0.689914, 0.461608], [0.001397, 0.846658]]
    U: 28.5
    report: true
    # 固定缺口(栅栏门)处有白色铁门, 信号只跌到~0.3, floor 0.18 成不了核。
    # floor 0.24 经 2026-09-10 日间帧验证: 缺口成核且整行无新增 FP。
    detect: {floor_max: 0.24}

# =============================================================================
# BarriGuard 部署配置文件（三层：相机 / 算法启用 / 标定文件）
# =============================================================================
# 修改后重启服务即可生效：python -m server  [备用：--config <path>]
# 每相机指定跑哪些算法 + 各算法的标定文件；标定路径相对仓库根解析。
# 标定内容（ROI + 算法参数）归各算法包所有（如 water_barrier/configs/），
# 这里只引用路径 + 启用开关，不放任何阈值。
# 数值单位：绝对像素（无分辨率缩放，直接作用于当前帧）。
# =============================================================================

server:
  host: "127.0.0.1"      # 监听地址
  port: 8000             # HTTP 端口（/stream/{id} /snapshot/{id}.jpg /mask/{id}.png）
  jpeg_quality: 80       # 预览 JPEG 质量
  preview_interval_s: 0.1  # MJPEG 帧间隔
  evidence_resave_s: 300.0  # 同一次持续报警的补存间隔（防刷盘；静态场景可加大）

# -----------------------------------------------------------------------------
# 摄像头列表（多流：每相机一个 Reader + 一套 Algorithm 实例）
# -----------------------------------------------------------------------------
cameras:
  - id: "1749"
    name: "Mobile Camera 1749"
    rtsp_url: "rtsp://118.140.234.166:8554/dahua1002490"
    enabled: true
    algorithms:
      water_gap:
        enabled: true
        calibration: "water_barrier/configs/1749.yaml"
      # night_lamp 未接入 server（仍走 night_lamp/main.py 独立运行），不占位

  - id: "1750"
    name: "Mobile Camera 1750"
    rtsp_url: "rtsp://118.140.234.166:8554/dahua1002491"
    enabled: true        # 视频流 + 水马检测（参数 copy 1749，待重标）
    algorithms:
      water_gap:
        enabled: true
        calibration: "water_barrier/configs/1750.yaml"

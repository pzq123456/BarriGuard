# =============================================================================
# BarriGuard 部署配置文件（统一管理所有可调参数）
# =============================================================================
# 修改后重启服务即可生效：python -m server  [备用：--config <path>]
# 支持多个算法（如 water_gap 水马缺口 / night_lamp 夜间灯光），按算法分块。
# 数值单位：绝对像素（无分辨率缩放，直接作用于当前帧）。
# =============================================================================

server:
  host: "127.0.0.1"      # 监听地址
  port: 8000             # HTTP 端口（/stream /snapshot.jpg /mask.png）
  jpeg_quality: 80       # 预览 JPEG 质量
  preview_interval_s: 0.1  # MJPEG 帧间隔

# -----------------------------------------------------------------------------
# 摄像头列表（每个摄像头指定运行哪种算法；算法默认参数见 algorithms 块）
# -----------------------------------------------------------------------------
cameras:
  - id: "1749"
    name: "Mobile Camera 1749"
    rtsp_url: "rtsp://118.140.234.166:8554/dahua1002490"
    algorithm: "water_gap"     # 运行算法的名称（与 algorithms 块一致）
    enabled: true

# -----------------------------------------------------------------------------
# 算法块 —— 水马缺口检测（红白分割 + 自主缺口 + 时序确认）
# -----------------------------------------------------------------------------
algorithms:
  water_gap:
    enabled: true

    color:                     # 水马色彩阈值（HSV/LAB）
      red_h: [0, 10, 168, 180] # 红色色相双区间
      red_s_min: 60            # 近端红底座最小饱和度
      red_a_min: 145           # 近端红底座最小 a*（土坡/锈铁 a*≈120-130）
      white_v_min: 195         # 近端白板最小 V
      white_s_max: 60          # 白板最大饱和度
      far_red_s_min: 25        # 远端红底座放宽（远端饱和低、色相不稳）
      far_red_a_min: 134
      far_red_v_min: 140
      far_white_v_min: 145     # 远端白板放宽 V（远排 V≈150-180；红底座锚定剔除非设施白色）
      far_white_s_max: 80

    cc:                        # 连通域均值色体检 + 最大/次大稳定化
      a_redish: 136            # 被保留的连通域需 a* 偏红
      v_whiteish: 145          # 或 V 偏白且低饱和
      s_whiteish: 80
      max_keep: 3              # 只保留面积前 max_keep 的大连通块（"最大+次大"思想）

    morph:                     # 形态学核（标定分辨率单位）
      open: [3, 3]             # 开运算去噪
      close: [9, 9]            # 闭运算补缝
      knit_h: [1, 21]          # 沿路向横向线段核，把屏障带连片
      knit_v: [21, 1]
      anchor: [9, 9]           # 红底座锚定间隙（白板贴近红底座即同一水马单元）
      min_cc_area: 12
      far_min_cc_area: 6

    region:                    # 场景几何（绝对像素）
      roi: [[0, 330, 900, 930], [1040, 295, 1462, 395], [880, 370, 1468, 950]]
      far_band: [[1040, 295, 1462, 395], [1040, 375, 1170, 445]]
      exclude: [[1100, 25, 1595, 135], [15, 825, 125, 900], [1272, 280, 1318, 306], [1420, 272, 1458, 306]]
      road_rois: [[700, 700, 1000, 860], [1040, 560, 1240, 660], [600, 850, 900, 900]]

    gap:                       # 自主缺口检测
      min_area: 3000           # 大连通块最小面积
      thr: 0.5                 # 块内带覆盖率阈值（低于即视为缺口）
      min_len: 2               # 缺口最低连续桶数
      end_margin: 0.04         # 剔除带首尾比例（避免把自然尽头当缺口）
      min_gap_px: 30.0         # 块间断口最小宽度
      max_gap_px: 90.0         # 块间断口最大宽度（大于此行边界/场景尺度，忽略）
      top_pieces: 6            # 参与缺口检测的最大连通块数

    track:                     # 时序确认状态机（NORMAL/SUSPECTED/ALARM）
      decay_rate: 0.5          # 异常秒数衰减速率（每秒）
      alarm_hold_s: 10.0       # 持续到 ALARM 所需秒数
      reconfirm_s: 5.0         # RER 复核最小间隔
      rer_threshold: 0.25      # 路露率阈值（非路≤0.10 vs 真缺口 0.27-0.65）
      track_stale_s: 8.0       # 长时间未匹配到缺口则删除轨道
      match_iou: 0.25          # 缺口bbox匹配最小 IoU
      match_center_ratio: 0.5  # 缺口中心距离与其尺寸之比上限
      median_window: 5         # 时序中值帧窗口
      intact_reset_s: 5.0      # 连续正常秒数，达到后快速脱锁到 NORMAL
      rer_purity: 0.70         # RER patch 纯度下限
      patch_size: 8            # RER patch 尺寸

  night_lamp:                  # 夜间警示灯熄灭检测（兄弟算法；离线批量，相机接入前先标定）
    enabled: false
    video: "./tmp/1749_202609040100.mp4"   # 输入视频（batch 模式）
    win_s: 180.0               # 逐窗口时长（秒）
    stride: 2                  # 采样步长
    flash_th: 60               # flash = max - bg 阈值
    on_px: 8                   # 视为"on"的闪光像素数
    roi_r: 10                  # 热点缓存 ROI 半径
    spot_min_a: 6              # flash 连通域最小面积
    merge_r: 10                # 热点合并半径
    dome_static_frac: 0.60     # 静态灯罩累计占比
    alive_r: 18                # 与 ALIVE 的 x 距离
    alive_dy: 12               # 与 ALIVE 的 y 距离
    lag_range: [5, 12]         # 自相关显著滞后区间
    ac_th: 0.35                # 自相关阈值
    duty_range: [0.05, 0.85]   # 占空比区间
    win_stable: 0.60           # on 窗口占比阈值
    bands:                     # 场景分带（相机 1749 晚）
      near: [0, 380, 1100, 720]
      far: [1100, 360, 1920, 470]
      right: [1100, 470, 1920, 1065]

# -----------------------------------------------------------------------------
# 告警参数
# -----------------------------------------------------------------------------
alert:
  cooldown_s: 10               # 同摄像头两次告警最小间隔（秒）
  save_frame_overlay: false    # 是否保存证据帧叠加

# -----------------------------------------------------------------------------
# 日志
# -----------------------------------------------------------------------------
log:
  level: "INFO"                # DEBUG | INFO | WARNING | ERROR

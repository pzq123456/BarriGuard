# =============================================================================
# BarriGuard 生产运行时配置（Wave 0 冻结 schema）
# =============================================================================
# 唯一事实源：显式声明“哪些相机跑哪些算法、用什么标定、何时跑、多久出一次结果、
# 如何上报”。缺键/未知键应启动失败（校验由 Wave 1 config loader 实现），
# 不得回落到代码默认值或静默跳过。
#
# 三层边界：
#   本文件 / runtime + schedule + callback + cameras  -> “跑什么/何时跑/输出给谁”
#   算法业务策略（rollowing confidence/min_interval/hold/reconfirm） -> 本文件
#   算法数据资产（水马 ROI/road 几何） -> 算法包 calibration 文件（只给路径）
#
# 红线（写入所有实施任务书）：
#   ① series_cap=600 只是 benchmark，不是 production 默认（此处为 null=全序列）
#   ② online candidate discovery 与 golden 必须独立量化，不得用 golden 候选集证明等价
#   ③ Report 对旧 Algorithm.step 必须 additive（旧算法无需修改）
#   ④ NightSession 严格按夜隔离；finalize/callback 失败不得污染下一夜
# =============================================================================
version: 1

runtime:
  host: "0.0.0.0"                 # 容器内必须 0.0.0.0
  port: 8000
  jpeg_quality: 80
  log_level: "warning"
  memory_budget_mb_per_camera: 500  # manifest-only, optional
  output_dir: "data"               # 落盘根目录；docker 挂载 ./data:/app/data
  persist_images: false            # 不落图片，仅保留 JSON 交换格式
  retention_hours: 48              # 定时清理：删除落盘中超过 48h 的文件

schedule:
  timezone: "Asia/Shanghai"
  day_start: "07:00"
  day_end: "17:00"
  night_start: "20:00"
  night_end: "03:00"              # 可跨零点
  report_at: "07:00"              # 夜灯热力图 finalize/推送

callback:
  enabled: true
  url: "http://192.168.1.24:6034/protal/ai-alarm/webhook"
  timeout_s: 10
  retries: 2                      # 失败后额外重试次数
  queue_size: 64                  # 必须有界
  image_field: "frame_base64"

cameras:
  - id: "1749"
    name: "Mobile Camera 1749"
    rtsp_url: "rtsp://118.140.234.166:8554/dahua1002490"
    enabled: true
    algorithms:
      water_gap:
        enabled: true
        schedule: day
        calibration: "water_barrier/configs/1749.yaml"
        status: ready                 # manifest-only
        report_interval_s: 3600     # 每小时一张缺口图（报告节奏）
        alarm_min_interval_s: 3600  # 最小告警间隔（与 report 独立）
        confidence: 0.25            # RER 门（非路≤0.10 vs 真缺口 0.27~0.65）
        alarm_hold_s: 10.0
        reconfirm_s: 5.0
        # 检测/跟踪参数（原 water_barrier/configs/1749.yaml）
        # floor_max 0.24：R4 实测栅栏门白铁门信号只跌到~0.3，0.24 下缺口连跑 51 站
        detect: {trim: 0.04, conf_th: 0.30, support_th: 0.3, min_box_width: 30,
                 floor_max: 0.24, core_exit: 0.06, min_width: 40, core_min_width: 30}
        track: {decay_rate: 0.5, track_stale_s: 8.0, match_iou: 0.25,
                match_center_ratio: 0.5, median_window: 5, intact_reset_s: 5.0,
                rer_purity: 0.70, patch_size: 8}

      night_lamp:
        enabled: true
        schedule: night
        status: ready                 # manifest-only
        night_gate: {enter_threshold: 100.0, exit_threshold: 120.0, persistence: 2}
        sampling: {interval_ms: 160}          # Phase 1 起点，非最终真理
        memory: {max_candidates: 200, series_cap: null}   # null=全序列；600 仅 benchmark
        baseline: {frames: 60, warmup_s: 600}
        periodicity: {period_step: 2, lag_lo_s: 0.3, lag_hi_s: 7.0,
                      peak_floor: 0.2, min_peaks: 3, gap_tol: 1, onset_min: 50}
        alignment: {min_cc: 0.5, on_low_cc: degraded}
        overnight: {enabled: true, cadence_minutes: 60, burst_seconds: 120, anchor: wall}

  - id: "1750"
    name: "Mobile Camera 1750"
    rtsp_url: "rtsp://118.140.234.166:8554/dahua1002491"
    enabled: true
    algorithms:
      water_gap:
        enabled: true
        schedule: day
        calibration: "water_barrier/configs/1750.yaml"
        status: calibration_pending   # 沿用但待重标；pending 只打印，不禁用（manifest-only）
        report_interval_s: 3600
        alarm_min_interval_s: 3600
        confidence: 0.50              # R4 九图阴影 FP rer≤0.40，取 0.50（裕量薄）
        alarm_hold_s: 10.0
        reconfirm_s: 5.0
        # 检测/跟踪参数（原 water_barrier/configs/1750.yaml）
        detect: {trim: 0.04, conf_th: 0.30, support_th: 0.3, min_box_width: 30,
                 floor_max: 0.18, core_exit: 0.06, min_width: 40, core_min_width: 30}
        track: {decay_rate: 0.5, track_stale_s: 8.0, match_iou: 0.25,
                match_center_ratio: 0.5, median_window: 5, intact_reset_s: 5.0,
                rer_purity: 0.70, patch_size: 8}

      night_lamp:
        enabled: true                 # 明确启用，不得因 pending 静默关闭
        schedule: night
        status: calibration_pending   # 8 盏 active，参数待重标（manifest-only）
        night_gate: {enter_threshold: 140.0, exit_threshold: 150.0, persistence: 2}
        sampling: {interval_ms: 160}
        memory: {max_candidates: 200, series_cap: null}
        baseline: {frames: 60, warmup_s: 600}
        periodicity: {period_step: 2, lag_lo_s: 0.3, lag_hi_s: 7.0,
                      peak_floor: 0.2, min_peaks: 3, gap_tol: 1, onset_min: 50}
        alignment: {min_cc: 0.5, on_low_cc: degraded}
        overnight: {enabled: true, cadence_minutes: 60, burst_seconds: 120, anchor: wall}

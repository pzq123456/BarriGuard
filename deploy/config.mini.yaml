# 加速 mini-night：用于本地/容器验证 hourly burst 管线（不是生产节奏）。
# 生产节奏见 config.yaml：cadence_minutes=60, burst_seconds=120。
#
# 本地文件源：camera.rtsp_url 指向挂载进容器的 mp4（server.source 本地分支走 cv2）。
version: 1

runtime:
  host: "0.0.0.0"
  port: 8000
  jpeg_quality: 80
  log_level: "info"
  memory_budget_mb_per_camera: 500  # manifest-only, optional
  output_dir: "data"

# 全天近似 NIGHT，便于启动后立即进入夜间 burst（仅验证用）。
schedule:
  timezone: "Asia/Shanghai"
  day_start: "23:58"
  day_end: "00:01"
  night_start: "00:01"
  night_end: "23:58"
  report_at: "23:59"

callback:
  enabled: false
  url: ""
  timeout_s: 8
  queue_size: 64
  image_field: "frame_base64"

cameras:
  - id: "1749"
    name: "Mini Camera 1749"
    rtsp_url: "tmp/1002490_night_10min.mp4"   # 本地文件源（非 stream scheme）
    enabled: true
    algorithms:
      night_lamp:
        enabled: true
        schedule: night
        calibration: "night_lamp/configs/config_1749.yaml"
        status: ready
        night_gate: {enter_threshold: 100.0, exit_threshold: 120.0, persistence: 2}
        sampling: {interval_ms: 160}
        memory: {max_candidates: 200, series_cap: null}
        baseline: {frames: 60, warmup_s: 600}
        periodicity: {period_step: 2, lag_lo_s: 0.3, lag_hi_s: 7.0,
                      peak_floor: 0.2, min_peaks: 3, gap_tol: 1, onset_min: 50}
        alignment: {method: ecc_translation, min_cc: 0.5, on_low_cc: degraded}
        overnight: {enabled: true, cadence_minutes: 2, burst_seconds: 60}
